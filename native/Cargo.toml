[package]
name = "alternator-python-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "Apache-2.0"
description = "Private native interface for alternator-client"

[lib]
name = "_alternator_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension = ["dep:pyo3", "dep:pyo3-async-runtimes", "pyo3/extension-module"]

[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
pyo3 = { version = "=0.29.0", optional = true }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"], optional = true }

alternator-client = { git = "https://github.com/scylladb/alternator-client-rust", rev = "d2044849bd3b0c100d18541b01df4a1a1eac3139" }
# Match the SDK graph validated by P0; update deliberately with compatibility tests.
aws-sdk-dynamodb = { version = "=1.130.0", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "=1.3.0"
aws-smithy-runtime-api = { version = "=1.19.0", features = ["client", "http-1x"] }
aws-smithy-types = { version = "=1.8.1", features = ["http-body-1-x"] }
bytes = "1.11.1"
http = "1.5.0"
http-body-util = "0.1.3"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.1"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.18", features = ["rt"] }

[package.metadata.alternator]
# Keep the baseline identical to the exact dependency revision above.
rust-repository = "https://github.com/scylladb/alternator-client-rust"
rust-baseline-revision = "d2044849bd3b0c100d18541b01df4a1a1eac3139"

[patch.crates-io]
tokio = { path = "vendor/tokio" }

[[test]]
name = "startup_cleanup"
path = "tests/startup_cleanup.rs"
harness = false
[dev-dependencies]
aws-smithy-async = "=1.3.0"
serde_json = "1.0"
flate2 = "1.1.5"
rcgen = "0.13"
