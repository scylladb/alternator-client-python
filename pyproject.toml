[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alternator-client"
dynamic = ["version"]
description = "Client-side load balancing for ScyllaDB Alternator"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "ScyllaDB", email = "info@scylladb.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["scylladb", "alternator", "dynamodb", "load-balancing", "boto3"]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.28.0",
    "botocore>=1.31.0",
]

[project.optional-dependencies]
async = [
    "aioboto3>=12.0.0",
    "aiobotocore>=2.5.0",
    "aiohttp>=3.8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.16.0",
    "types-aiobotocore[dynamodb]>=2.5.0",
    "boto3-stubs[dynamodb]>=1.28.0",
]

[project.urls]
Homepage = "https://github.com/scylladb/alternator-client-python"
Documentation = "https://github.com/scylladb/alternator-client-python#readme"
Repository = "https://github.com/scylladb/alternator-client-python"
Issues = "https://github.com/scylladb/alternator-client-python/issues"

[tool.setuptools.dynamic]
version = {attr = "alternator._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["alternator*"]

[tool.setuptools.package-data]
alternator = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["aioboto3"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "CPY",  # flake8-copyright
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
    "ARG002", # unused method argument
]

[tool.ruff.lint.isort]
known-first-party = ["alternator"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)Copyright ScyllaDB, Inc\\."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["alternator"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
