name: Classify release notes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to classify, including merged PRs
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: release-notes-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted inline code only: never check out or execute a PR's files.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        with:
          script: |
            const label = 'omit-from-release-notes';
            const rawNumber = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(rawNumber)) {
              throw new Error('A positive pull request number is required');
            }
            const issue_number = Number(rawNumber);
            if (!Number.isSafeInteger(issue_number)) throw new Error('Invalid PR number');
            const repo = context.repo;
            const params = {...repo, pull_number: issue_number};
            const removeLabel = async () => {
              try {
                await github.rest.issues.removeLabel({...repo, issue_number, name: label});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };
            const supportFile = path => typeof path === 'string' && (
              path.startsWith('tests/') || path.startsWith('native/tests/') ||
              path.startsWith('docs/') || path.startsWith('.github/') ||
              ['README.md', 'native/README.md', 'native/INTERFACE.md',
               'scripts/native/README.md', 'scripts/release/SIGNING.md',
               '.gitignore', '.editorconfig', '.pre-commit-config.yaml',
               '.ruff.toml', 'ruff.toml', '.mypy.ini', 'mypy.ini',
               'docker-compose.yml'].includes(path)
            );
            try {
              const {data: before} = await github.rest.pulls.get(params);
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...params, per_page: 100
              });
              const {data: after} = await github.rest.pulls.get(params);
              const complete = Number.isInteger(after.changed_files) &&
                after.changed_files > 0 && files.length === after.changed_files &&
                new Set(files.map(file => file.filename)).size === files.length &&
                before.head.sha === after.head.sha && before.base.sha === after.base.sha &&
                before.changed_files === after.changed_files;
              if (!complete) throw new Error('Incomplete or changing PR file list; keeping PR visible');
              const omit = files.every(file => supportFile(file.filename) &&
                (file.status !== 'renamed' || supportFile(file.previous_filename)));
              if (!omit) {
                await removeLabel();
                return;
              }
              try {
                await github.rest.issues.getLabel({...repo, name: label});
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...repo, name: label, color: 'ededed',
                    description: 'Support-only PR excluded from generated release notes'
                  });
                } catch (creationError) {
                  // Another PR may create the shared label concurrently.
                  if (creationError.status !== 422) throw creationError;
                  await github.rest.issues.getLabel({...repo, name: label});
                }
              }
              await github.rest.issues.addLabels({...repo, issue_number, labels: [label]});
            } catch (error) {
              // Do not leave stale exclusions behind on API errors or truncated lists.
              await removeLabel();
              throw error;
            }
