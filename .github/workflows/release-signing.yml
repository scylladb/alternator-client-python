name: Release signing
on:
  pull_request:
    paths: ['scripts/release/**', '.github/workflows/*release*', 'Makefile']
  push:
    branches: [main]
    paths: ['scripts/release/**', '.github/workflows/*release*', 'Makefile']
permissions:
  contents: read
jobs:
  release-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"
      - run: make test-release-signing
        env:
          RELEASE_REAL_BUILD_TEST: "1"
