name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy alternator --strict

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async]"

      - name: Run unit tests with coverage
        run: pytest tests/ -v --tb=short --ignore=tests/integration/ --timeout=60 --cov=alternator --cov-report=xml --cov-report=term-missing --cov-fail-under=70

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [lint, test]

    services:
      scylla:
        image: scylladb/scylla:latest
        ports:
          - 8000:8000
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe cluster' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --entrypoint /docker-entrypoint.py
          scylladb/scylla:latest
          --smp=1
          --memory=750M
          --overprovisioned=1
          --alternator-port=8000
          --alternator-write-isolation=always

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async]"

      - name: Wait for Scylla Alternator to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/localnodes && break
            echo "Waiting for Scylla Alternator... ($i)"
            sleep 5
          done

      - name: Run integration tests with coverage
        run: pytest tests/integration/ -v --tb=short --timeout=120 --cov=alternator --cov-report=xml --cov-report=term-missing
