# Shared non-code glob: every label below requires ALL changed files
# to be non-code. This lets non-code categories mix freely (e.g. a PR
# touching both tests/ and .github/ gets both `test` and `ci`).
# These categories do not control release-note exclusion. The separate
# omit-from-release-notes rule below uses a narrower support-only allowlist.

_non-code: &non-code
  - all-globs-to-all-files:
      - "{tests/**,.github/**,Makefile,docker-compose.yml,.pre-commit-config.yaml,**/*.md,docs/**,LICENSE,.gitignore,.editorconfig,.ruff.toml,ruff.toml,mypy.ini,.mypy.ini,pyproject.toml,requirements*.txt}"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - Makefile
          - docker-compose.yml
          - .pre-commit-config.yaml
  - changed-files: *non-code

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**
          - LICENSE
  - changed-files: *non-code

test:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
  - changed-files: *non-code

chore:
  - changed-files:
      - any-glob-to-any-file:
          - .gitignore
          - .editorconfig
          - .ruff.toml
          - ruff.toml
          - mypy.ini
          - .mypy.ini
  - changed-files: *non-code

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - requirements*.txt
  - changed-files: *non-code

bug:
  - head-branch:
      - ^fix/.*
      - ^bugfix/.*
      - ^hotfix/.*

enhancement:
  - head-branch:
      - ^feat/.*
      - ^feature/.*

# Every reported filename must match this single union of support paths.
# Keep runtime sources, dependency manifests and packaging/build inputs visible.
omit-from-release-notes:
  - changed-files:
      - all-globs-to-all-files:
          - "{tests/**,native/tests/**,docs/**,.github/tests/**,.github/ISSUE_TEMPLATE/**,.github/RELEASE_NOTES.md,.github/workflows/call_jira_sync.yml,.github/workflows/sync-from-jira-test.yml,README.md,native/README.md,native/INTERFACE.md,scripts/native/README.md,scripts/release/SIGNING.md,.gitignore,.editorconfig,.pre-commit-config.yaml,.ruff.toml,ruff.toml,.mypy.ini,mypy.ini,docker-compose.yml}"
